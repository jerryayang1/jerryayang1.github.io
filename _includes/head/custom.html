{% if page.mathjax %}
<script>
  MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]]
    },
    svg: {
      fontCache: "global"
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<style>
  .layout--splash .page__content > .sidebar {
    float: left;
    width: 220px;
    margin: 0 2rem 1rem 0;
  }

  .layout--splash .page__content > .sidebar:after {
    display: none;
  }

  @media (max-width: 64em) {
    .layout--splash .page__content > .sidebar {
      float: none;
      width: auto;
      margin: 0 auto 2rem;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var hero = document.querySelector(".page__hero--overlay");
    if (!hero) {
      return;
    }

    var images = [
      "/assets/images/crystal.png",
      "/assets/images/ebpg1.png",
      "/assets/images/ebpg2.png",
      "/assets/images/ebpg3.png",
      "/assets/images/ebpg4.png",
      "/assets/images/Lamella_001.png",
      "/assets/images/Lamella_002.png",
      "/assets/images/scallops1.png",
      "/assets/images/scallops2.png",
      "/assets/images/sidewall.png"
    ];
    var index = 0;

    window.setInterval(function () {
      index = (index + 1) % images.length;
      hero.style.backgroundImage =
        "linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('" +
        images[index] +
        "')";
    }, 5000);
  });
</script>
