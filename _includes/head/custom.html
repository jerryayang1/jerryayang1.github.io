{% if page.mathjax %}
<script>
  MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]]
    },
    svg: {
      fontCache: "global"
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<style>
  .page__content {
    overflow-wrap: anywhere;
  }

  .page__content img {
    max-width: 100%;
    height: auto;
  }

  .layout--splash .page__content {
    position: relative;
  }

  .layout--splash .page__content > .sidebar {
    position: absolute;
    top: 0;
    left: 0;
    width: 220px;
    margin: 0;
  }

  .layout--splash .page__content > .sidebar:after {
    display: none;
  }

  .layout--splash .page__content > :not(.sidebar) {
    margin-left: 260px;
  }

  @media (max-width: 64em) {
    .layout--splash .page__content > .sidebar {
      position: static;
      width: 100%;
      max-width: 220px;
      margin: 0 auto 2rem;
    }

    .layout--splash .page__content > :not(.sidebar) {
      margin-left: 0;
    }
  }

  @media (max-width: 480px) {
    .layout--splash .page__content > .sidebar {
      max-width: 180px;
    }

    .page__content {
      font-size: 0.95rem;
    }
  }

  @media (max-width: 64em) {
    .greedy-nav .visible-links {
      display: none;
    }

    .greedy-nav .greedy-nav__toggle {
      display: block !important;
      margin-left: auto;
    }

    .greedy-nav .hidden-links {
      left: 0;
      right: 0;
      width: auto;
      margin: 0;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (window.matchMedia("(max-width: 64em)").matches) {
      var visibleLinks = document.querySelector(".greedy-nav .visible-links");
      var hiddenLinks = document.querySelector(".greedy-nav .hidden-links");
      var toggle = document.querySelector(".greedy-nav .greedy-nav__toggle");

      if (visibleLinks && hiddenLinks && toggle) {
        while (visibleLinks.firstElementChild) {
          hiddenLinks.appendChild(visibleLinks.firstElementChild);
        }
        toggle.classList.remove("hidden");
      }
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    var hero = document.querySelector(".page__hero--overlay");
    if (!hero) {
      return;
    }

    var images = [
      "/assets/images/crystal.png",
      "/assets/images/ebpg1.png",
      "/assets/images/ebpg2.png",
      "/assets/images/ebpg3.png",
      "/assets/images/ebpg4.png",
      "/assets/images/Lamella_001.png",
      "/assets/images/Lamella_002.png",
      "/assets/images/scallops1.png",
      "/assets/images/scallops2.png",
      "/assets/images/sidewall.png"
    ];
    var index = 0;

    window.setInterval(function () {
      index = (index + 1) % images.length;
      hero.style.backgroundImage =
        "linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('" +
        images[index] +
        "')";
    }, 5000);
  });
</script>
